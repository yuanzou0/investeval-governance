[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investeval"
version = "0.1.0"
description = "Deterministic evaluation core for an investment-agent governance platform"
requires-python = ">=3.10"

[project.scripts]
investeval = "investeval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
